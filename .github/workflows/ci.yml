name: Build and test
# Explicit opt-in only: do not spend GitHub Actions minutes on every commit.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish a multi-architecture GHCR image"
        required: false
        type: boolean
        default: false
concurrency:
  group: network-sync-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build:web
      - run: docker build -t network-sync:test .
      - run: bash scripts/smoke.sh

  publish:
    if: github.ref == 'refs/heads/main' && inputs.publish == true
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/albaintor/network-sync:latest
            ghcr.io/albaintor/network-sync:sha-${{ github.sha }}
