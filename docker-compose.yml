services:
  network-sync:
    # Build on the NAS: no GitHub Actions minutes or GHCR publication required.
    build:
      context: .
    image: network-sync:local
    container_name: network-sync
    restart: unless-stopped
    init: true
    user: "${PUID:-1026}:${PGID:-100}"
    # Supplementary NAS ACL group. Example: administrators=101 on Synology.
    # Keep the default at users=100; opt in to 101 only if required by the ACL.
    group_add:
      - "${NAS_EXTRA_GID:-100}"
    ports:
      - "${PORT:-8088}:8080"
    environment:
      TZ: "${TZ:-Europe/Paris}"
      APP_USERNAME: "${APP_USERNAME:?Set APP_USERNAME in .env}"
      APP_PASSWORD: "${APP_PASSWORD:?Set APP_PASSWORD in .env}"
      DATA_DIR: /app/data
      # Accessible Docker mounts, NOT preset synchronization source/destination.
      SYNC_MOUNT_ROOTS: /volume1;/volumeUSB1
    volumes:
      - ./data:/app/data
      # Only directories explicitly mounted here can be selected in the UI.
      # Both mounts are read/write so either can be chosen as a destination.
      - /volume1:/volume1:rw
      - /volumeUSB1:/volumeUSB1:rw
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
